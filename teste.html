<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
		crossorigin="anonymous"></script>
	<title>Document</title>
</head>

<body>
	<form name="form" role="form">
		<div>
			<input type="hidden" id="idRM" name="idRM"></input>
			<input type="hidden" id="statusRM" name="statusRM"></input>
		</div>

		<h3 class="text-center">Requisição de Transferencia com Alteração de Dados Funcionais</h3>
		<div class="row">
			<div class="col-md-6">
				<label for="selRequisitante">Requisitante:</label>
				<select id="selRequisitante" name="selRequisitante" class="form-control" required>
					<option value=""></option>
					<option value="1">1 - Jenifer Mendes</option>
					<option value="1">2 - Lucas Campos</option>
				</select>
			</div>
		</div>

		<div class="col-md-12 row g-3">
			<div class="col-md-6">
				<label for="selfuncionario">Funcionario:</label>
				<select id="selfuncionario" name="selfuncionario" class="form-control" required>
					<option value=""></option>
					<option value="1">1 - Jenifer Mendes</option>
					<option value="1">2 - Lucas Campos</option>
				</select>
			</div>
			<div class="col-md-6">
				<label for="inpDtPrevisao">Previsão:</label>
				<input id="inpDtPrevisao" name="inpDtPrevisao" type="date"></input>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12">
				<label for="txtAreaJustificativa">Justificativa:</label>
				<textarea id="txtAreaJustificativa" name="txtAreaJustificativa" rows="5" cols="30"></textarea>
			</div>
		</div>

		<div class="row">
			<h4 class="text-center">Dados atuais do Funcionario</h4>
			<div class="col-md-12">
				<label for="selFilialOrigem">Filial de Origem:</label>
				<select id="selFilialOrigem" name="selFilialOrigem" class="form-control" required>
					<option value=""></option>
					<option value="1">filial 01</option>
					<option value="1">filial 02</option>
				</select>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12">
				<label for="selSecaoOrigem">Seção de Origem:</label>
				<select id="selSecaoOrigem" name="selSecaoOrigem" class="form-control" required>
					<option value=""></option>
					<option value="1">Seção 01</option>
					<option value="1">Seção 02</option>
				</select>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12">
				<label for="selFunOrigem">Função de Origem:</label>
				<select id="selFunOrigem" name="selFunOrigem" class="form-control" required>
					<option value=""></option>
					<option value="1">Função 01</option>
					<option value="1">Função 02</option>
				</select>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12">
				<h5>Tabela Salarial</h5>
				<label for="SelNivelSal">Nivel Salarial de Origem:</label>
				<select id="SelNivelSal" name="SelNivelSal" class="form-control" required>
					<option value=""></option>
					<option value="1">nivel salarial01</option>
					<option value="1">nivel salarial02</option>
				</select>

				<label for="SelFaixaSal">Faixa Salarial de Origem:</label>
				<select id="SelFaixaSal" name="SelFaixaSal" class="form-control" required>
					<option value=""></option>
					<option value="1">faixa salarial 01</option>
					<option value="1">faixa salarial 02</option>
				</select>

				<label for="SalSalOrigem">Salario de Origem:</label>
				<select id="SalSalOrigem" name="SalSalOrigem" class="form-control" required>
					<option value=""></option>
					<option value="1">salario de origem 01</option>
					<option value="1">salario de origem 02</option>
				</select>
			</div>
		</div>

		<div class="row">
			<h4 class="text-center">Proposta de Alteração</h4>
			<div class="col-md-12">

				<label for="SelFilial">Filial:</label>
				<select id="SelFilial" name="SelFilial" class="form-control" required>
					<option value=""></option>
					<option value="1">Filial 01</option>
					<option value="1">Filial 02</option>
				</select>
				<label for="SelSecao">Seção:</label>
				<select id="SelSecao" name="SelSecao" class="form-control" required>
					<option value=""></option>
					<option value="1">Seção 01</option>
					<option value="1">Seção 02</option>
				</select>
				<label for="SelFuncao">Função:</label>
				<select id="SelFuncao" name="SelFuncao" class="form-control" required>
					<option value=""></option>
					<option value="1">Função 01</option>
					<option value="1">Função 02</option>
				</select>

				<h5>A Coligada 1 não considera a tabela salarial em suas propostas.</h5>
				<label for="Nivel">Nivel</label>
				<select id="Nivel" name="Nivel" class="form-control" required>
					<option value=""></option>
					<option value="1">nivel 01</option>
					<option value="1">nivel 02</option>
				</select>

				<label for="Faixa">Faixa</label>
				<select id="Faixa" name="Faixa" class="form-control" required>
					<option value=""></option>
					<option value="1">faixa 01</option>
					<option value="1">faixa 02</option>
				</select>

				<label for="Percentual">Percentual</label>
				<input type="number" id="Percentual" name="Percentual" step="0.01" min="0" placeholder="0,00">

				<label for="Salario">Salario</label>
				<input type="number" id="Salario" name="Salario" min="0" placeholder="Somente números">

			</div>
		</div>

		<div class="col-md-12 row g-3">

			<div class="col-md-5">
				<label for="MudancaSecao">Motivo de Mudança de Seção:</label>
				<select id="MudancaSecao" name="MudancaSecao" class="form-control" required>
					<option value=""></option>
					<option value="1">Mudança 01</option>
					<option value="1">Mudança 02</option>
				</select>
			</div>
			<div class="col-md-5">
				<label for="MudancaFun">Motivo de Mudança de Função:</label>
				<select id="MudancaFun" name="MudancaFun" class="form-control" required>
					<option value=""></option>
					<option value="1">Mudança 01</option>
					<option value="1">Mudança 02</option>
				</select>
			</div>
			<div class="col-md-5">
				<label for="MudancaSal">Motivo de Mudança de Salarial:</label>
				<select id="MudancaSal" name="MudancaSal" class="form-control" required>
					<option value=""></option>
					<option value="1">Mudança 01</option>
					<option value="1">Mudança 02</option>
				</select>
			</div>
		</div>

		<div class="col-md-12 row g-3">
			<div class="col-md-2">
				<div class="form-check form-switch">
					<input class="form-check-input" type="checkbox" name="GerarSubstituicao" id="GerarSubstituicao">
					<label class="form-check-label" for="GerarSubstituicao">Gerar Subistituição</label>
				</div>
			</div>
			<div class="col-md-2">
				<div class="form-check form-switch">
					<input class="form-check-input" type="checkbox" name="TransferirVaga" id="TransferirVaga">
					<label class="form-check-label" for="TransferirVaga">Transferir Vaga</label>
				</div>
			</div>
		</div>

	</form>
</body>

</html>
